name: release

# Publishes @zfuzz/mcp to npm with provenance. Pure JS wrapper that delegates to
# @zfuzz/cli — its source is fully public in this repo, so npm provenance links
# the package to this commit + CI run. Trigger by publishing a Release (tag = the
# version, e.g. v0.2.1).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish @zfuzz/mcp (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
